name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  FLUTTER_VERSION: "3.47.3"
  BUILD_TOOLS_VERSION: "37.0.0"
  NDK_VERSION: "28.2.13676358"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check VERSION matches the app
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          app_version="$(grep -oP "version = '\K[^']+" lib/app_info.dart)"
          echo "VERSION=$file_version app_info=$app_version"
          test -n "$file_version"
          test "$file_version" = "$app_version"

      - name: Fetch xray-core assets
        run: bash ./scripts/fetch-xray.sh linux-64

      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: if [ -d test ]; then flutter test; else echo "no test/ directory, skipping"; fi

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android build-tools & NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" \
                "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
                "ndk;${{ env.NDK_VERSION }}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "sdkmanager failed after $attempt attempts" >&2
              exit 1
            fi
            echo "sdkmanager failed (attempt $attempt), retrying..." >&2
            rm -rf "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" \
                   "$ANDROID_HOME/.temp" "$ANDROID_HOME/.downloadIntermediates"
            sleep $((attempt * 15))
          done
          test -x "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write key.properties
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Fetch xray-core for Android
        run: bash ./scripts/fetch-xray.sh android

      - run: flutter pub get

      - name: Compute versionCode
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          IFS=. read -r major minor patch <<<"$version"
          echo "VERSION_CODE=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_ENV"

      - name: Build release APKs (universal + one per ABI)
        run: |
          out=build/app/outputs/flutter-apk
          flutter build apk --release --build-number="$VERSION_CODE" --split-debug-info=build/symbols
          mv "$out/app-release.apk" "$out/app-universal-release.apk"
          for pair in arm64-v8a:android-arm64 armeabi-v7a:android-arm x86_64:android-x64; do
            abi="${pair%%:*}"
            platform="${pair##*:}"
            flutter build apk --release --build-number="$VERSION_CODE" \
              --target-platform "$platform" --split-debug-info=build/symbols
            mv "$out/app-release.apk" "$out/app-$abi-release.apk"
          done
          ls -l "$out"

      - name: Strip, zipalign & sign
        if: env.HAS_KEYSTORE == 'true'
        run: bash ./scripts/strip.sh
        env:
          APK_OUTPUT_DIR: build/app/outputs/flutter-apk
          BUILD_TOOLS_DIR: ${{ env.ANDROID_HOME }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
          STRIP_TOOL: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK native libs per ABI
        if: env.HAS_KEYSTORE == 'true'
        run: bash ./scripts/verify-apk.sh
        env:
          APK_OUTPUT_DIR: build/app/outputs/flutter-apk
          BUILD_TOOLS_DIR: ${{ env.ANDROID_HOME }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: android-signed-apks
          path: build/app/outputs/flutter-apk/Pray-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE != 'true'
        with:
          name: android-unsigned-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: build/symbols
          retention-days: 90
          if-no-files-found: error

  linux:
    needs: check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            xray: linux-64
            bundle: x64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            xray: linux-arm64
            bundle: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x86_64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter (arm64)
        if: matrix.arch == 'aarch64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Fetch xray-core for Linux
        run: bash ./scripts/fetch-xray.sh ${{ matrix.xray }}

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Check the bundle
        run: |
          test -x build/linux/${{ matrix.bundle }}/release/bundle/pray
          test -f build/linux/${{ matrix.bundle }}/release/bundle/data/flutter_assets/assets/xray/linux/xray
          test -f build/linux/${{ matrix.bundle }}/release/bundle/data/flutter_assets/assets/xray/linux/geoip.dat

      - name: Build AppImage
        run: bash ./scripts/appimage.sh
        env:
          ARCH: ${{ matrix.arch }}
          BUNDLE_DIR: build/linux/${{ matrix.bundle }}/release/bundle
          OUTPUT_DIR: ${{ github.workspace }}/dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch xray-core for Windows
        run: bash ./scripts/fetch-xray.sh windows-64

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Check the bundle
        run: |
          dir=build/windows/x64/runner/Release
          test -f "$dir/pray.exe"
          test -f "$dir/flutter_windows.dll"
          test -f "$dir/data/app.so"
          test "$(wc -c < "$dir/data/flutter_assets/assets/xray/windows/xray.exe")" -gt 1000000
          test -s "$dir/data/flutter_assets/assets/xray/linux/geoip.dat"

      - name: Bundle the Visual C++ runtime
        run: |
          dir=build/windows/x64/runner/Release
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" "$dir/" || echo "warning: $dll not found"
          done

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = (Get-Content VERSION -Raw).Trim()
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$version" windows/installer/pray.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          if (-not (Test-Path dist/Pray-windows-x64-setup.exe)) { throw "installer missing" }

      - name: Test the installer (silent install, check, uninstall)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "pray-install"
          $p = Start-Process -FilePath dist/Pray-windows-x64-setup.exe `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOICONS","/DIR=$dir" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          foreach ($f in "pray.exe","flutter_windows.dll","data\app.so","data\icudtl.dat",
                         "data\flutter_assets\assets\xray\windows\xray.exe","unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          $app = Start-Process -FilePath (Join-Path $dir "pray.exe") -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) {
            Write-Host "::warning::pray.exe exited right after launch (code $($app.ExitCode))"
          } else {
            Stop-Process -Id $app.Id -Force
          }
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/Pray-windows-x64-setup.exe
          if-no-files-found: error

  release:
    needs: [android, linux, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Tag this commit
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Pray ${{ env.TAG }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/android-signed-apks/*.apk
            artifacts/linux-appimage-*/*.AppImage
            artifacts/windows-x64/*.exe
