name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  FLUTTER_VERSION: "3.47.3"
  BUILD_TOOLS_VERSION: "37.0.0"
  NDK_VERSION: "28.2.13676358"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check VERSION matches the app
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          app_version="$(grep -oP "version = '\K[^']+" lib/app_info.dart)"
          echo "VERSION=$file_version app_info=$app_version"
          test -n "$file_version"
          test "$file_version" = "$app_version"

      - name: Fetch xray-core assets
        run: bash ./scripts/fetch-xray.sh linux-64

      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: if [ -d test ]; then flutter test; else echo "no test/ directory, skipping"; fi

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android build-tools & NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # The NDK download occasionally arrives corrupted ("Error on ZipFile
          # unknown archive"), so retry from a clean slate.
          for attempt in 1 2 3; do
            if "$SDKMANAGER" \
                "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
                "ndk;${{ env.NDK_VERSION }}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "sdkmanager failed after $attempt attempts" >&2
              exit 1
            fi
            echo "sdkmanager failed (attempt $attempt), retrying..." >&2
            rm -rf "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" \
                   "$ANDROID_HOME/.temp" "$ANDROID_HOME/.downloadIntermediates"
            sleep $((attempt * 15))
          done
          test -x "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write key.properties
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Fetch xray-core for Android
        run: bash ./scripts/fetch-xray.sh android

      - run: flutter pub get

      - name: Build universal release APK
        run: |
          flutter build apk --release --split-debug-info=build/symbols
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-universal-release.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Strip, zipalign & sign
        if: env.HAS_KEYSTORE == 'true'
        run: bash ./scripts/strip.sh
        env:
          APK_OUTPUT_DIR: build/app/outputs/flutter-apk
          BUILD_TOOLS_DIR: ${{ env.ANDROID_HOME }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
          STRIP_TOOL: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK native libs per ABI
        if: env.HAS_KEYSTORE == 'true'
        run: bash ./scripts/verify-apk.sh
        env:
          APK_OUTPUT_DIR: build/app/outputs/flutter-apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: android-signed-apks
          path: build/app/outputs/flutter-apk/Pray-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE != 'true'
        with:
          name: android-unsigned-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: build/symbols
          retention-days: 90
          if-no-files-found: error

  linux:
    needs: check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            xray: linux-64
            bundle: x64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            xray: linux-arm64
            bundle: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x86_64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter (arm64)
        if: matrix.arch == 'aarch64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Fetch xray-core for Linux
        run: bash ./scripts/fetch-xray.sh ${{ matrix.xray }}

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Check the bundle
        run: |
          test -x build/linux/${{ matrix.bundle }}/release/bundle/pray
          test -f build/linux/${{ matrix.bundle }}/release/bundle/data/flutter_assets/assets/xray/linux/xray
          test -f build/linux/${{ matrix.bundle }}/release/bundle/data/flutter_assets/assets/xray/linux/geoip.dat

      - name: Build AppImage
        run: bash ./scripts/appimage.sh
        env:
          ARCH: ${{ matrix.arch }}
          BUNDLE_DIR: build/linux/${{ matrix.bundle }}/release/bundle
          OUTPUT_DIR: ${{ github.workspace }}/dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [android, linux]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Tag this commit
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Pray ${{ env.TAG }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/android-signed-apks/*.apk
            artifacts/linux-appimage-*/*.AppImage
